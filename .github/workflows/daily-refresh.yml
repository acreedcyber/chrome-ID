name: Daily Chrome-Stats refresh

# Runs every day at 09:00 UTC (~05:00 ET / ~02:00 PT). Adjust the cron if
# you'd prefer a different window. The "workflow_dispatch" trigger lets you
# kick off a run manually from the Actions tab any time.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write   # required so the action can commit & push refreshed CSVs

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull fresh data from Chrome-Stats
        env:
          CHROME_STATS_API_KEY: ${{ secrets.CHROME_STATS_API_KEY }}
        run: python scripts/fetch_chromestats.py

      - name: Commit refreshed CSVs
        run: |
          set -euo pipefail
          git config user.name  "chrome-stats-bot"
          git config user.email "chrome-stats-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          STAMP="$(date -u +'%Y-%m-%d %H:%M UTC')"
          git commit -m "chore(data): daily Chrome-Stats refresh ${STAMP}"
          git push
